name: DC Foundry Digital CRM — CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Testes Vitest, Build & Verificação de Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck em todos os pacotes
        run: pnpm -r run typecheck

      - name: Executar suíte de testes (Vitest)
        run: pnpm test

      - name: Build de Produção Web PWA
        run: pnpm --filter @dcfoundry/web build
