<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a4c" />
    <title>CRM sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f6f1e8;
        color: #102a4c;
        font-family: Manrope, system-ui, sans-serif;
      }
      main {
        width: min(440px, calc(100% - 32px));
        padding: 28px;
        border-radius: 20px;
        background: #fffdf9;
        border: 1px solid #e2d6c2;
        box-shadow: 0 8px 24px rgba(14, 27, 42, 0.08);
      }
      p { color: #56667c; line-height: 1.6; }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        letter-spacing: -0.03em;
        font-size: 32px;
        margin: 8px 0 12px;
      }
      a {
        display: inline-flex;
        margin-top: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: #1d5fae;
        color: #fffdf9;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>DC Foundry Digital</p>
      <h1>Vamos retomar a conexão.</h1>
      <p>O CRM precisa de internet para mostrar seus dados e salvar alterações. Nenhum dado de cliente fica disponível neste modo offline.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
