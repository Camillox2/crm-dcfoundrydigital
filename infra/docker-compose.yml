name: dc-foundry-crm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dcfoundry-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcfoundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dcfoundry_crm}
    command:
      - 'postgres'
      - '-c'
      - 'shared_buffers=128MB'
      - '-c'
      - 'effective_cache_size=384MB'
      - '-c'
      - 'work_mem=4MB'
      - '-c'
      - 'maintenance_work_mem=32MB'
      - '-c'
      - 'max_connections=24'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dcfoundry} -d ${POSTGRES_DB:-dcfoundry_crm}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: dcfoundry-crm-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '96mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    mem_limit: 128m

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: dcfoundry-crm-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_OPTIONS: '--max-old-space-size=256'
      PORT: '4000'
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - crm_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
    mem_limit: 384m

  worker:
    profiles: ['whatsapp']
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: dcfoundry-crm-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_OPTIONS: '--max-old-space-size=256'
      WHATSAPP_SESSION_DIR: '/data/whatsapp-auth'
      WHATSAPP_MAX_SESSIONS: '1'
    volumes:
      - whatsapp_sessions:/data/whatsapp-auth
      - crm_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    mem_limit: 384m

  caddy:
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:-localhost}
    image: caddy:2-alpine
    container_name: dcfoundry-crm-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 96M
    mem_limit: 96m

volumes:
  whatsapp_sessions:
  crm_uploads:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
